name: Build

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Optional surefire -Dtest selector; empty runs the full suite'
        required: false
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v2
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '11'
          cache: 'maven'
      - name: Build with Maven
        run: |
          if [ -n "${{ inputs.test-filter }}" ]; then
            mvn --batch-mode --update-snapshots verify -Dtest='${{ inputs.test-filter }}' -Dsurefire.failIfNoSpecifiedTests=false -DfailIfNoTests=false
          else
            mvn --batch-mode --update-snapshots verify
          fi
      - name: List skipped tests
        if: always()
        run: |
          find . -path '*/target/surefire-reports/*.xml' -exec awk '/<skipped/ { print FILENAME ": " prev; print } { prev = $0 }' {} +
      - name: Upload gson jar
        uses: actions/upload-artifact@v4
        with:
          name: gson-jar
          path: gson/target/gson-2.9.0.jar
          if-no-files-found: error
